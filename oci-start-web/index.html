<!DOCTYPE html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09161c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OCI-START</title>
    <style>
      body { margin: 0; }
      .startup-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #f5f5f7; color: #000; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; opacity: 0; animation: startup-reveal 0s 160ms forwards; }
      html[data-theme="dark"] .startup-loading { background: #000; color: #f5f5f7; }
      .startup-spinner { width: 28px; height: 28px; box-sizing: border-box; border: 2px solid rgba(27, 138, 106, .18); border-top-color: #1b8a6a; border-radius: 50%; animation: startup-spin .8s linear infinite; }
      .startup-en, html[lang^="en"] .startup-zh { display: none; }
      html[lang^="en"] .startup-en { display: inline; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @keyframes startup-reveal { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .startup-spinner { animation: none; } .startup-loading { animation: none; opacity: 1; } }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('oci_theme') || 'light'
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          var theme = t === 'dark' ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {}
        try {
          var queryLang = new URLSearchParams(window.location.search).get('lang')
          var bootLang = ['zh', 'zh_CN', 'zh_TW', 'en', 'en_US'].includes(queryLang) ? queryLang : localStorage.getItem('lang')
          document.documentElement.lang = bootLang === 'en' || bootLang === 'en_US' ? 'en' : 'zh-CN'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"><div id="startup-loading" class="startup-loading" role="status" aria-live="polite"><span class="startup-spinner" aria-hidden="true"></span><span class="startup-zh">加载中…</span><span class="startup-en">Loading…</span></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
