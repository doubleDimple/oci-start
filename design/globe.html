<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全球点位地球</title>
<style>
  :root{
    --void:#04080f;
    --panel:rgba(8,17,28,.82);
    --line:rgba(120,190,220,.16);
    --text:#dcecf3;
    --muted:#6f93a8;
    --glow:#4fe3c1;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--void)}
  body{font-family:var(--sans);color:var(--text)}

  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}

  /* 悬浮标签层 */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:5}
  .tag{
    position:absolute;transform:translate(14px,-50%);white-space:nowrap;
    font-size:12px;line-height:1.3;letter-spacing:.2px;
    color:var(--text);text-shadow:0 0 8px rgba(0,0,0,.9);
    padding-left:10px;border-left:1px solid rgba(79,227,193,.5);
    transition:opacity .25s;
  }
  .tag b{font-weight:500;display:block}
  .tag span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

  /* 侧栏 */
  #panel{
    position:fixed;top:0;left:0;bottom:0;width:320px;z-index:10;
    background:var(--panel);backdrop-filter:blur(14px);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;transition:transform .3s;
  }
  #panel.hidden{transform:translateX(-100%)}
  .head{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
  .head h1{margin:0;font-size:16px;font-weight:600;letter-spacing:1px}
  .head p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.5}

  .sec{padding:16px 20px;border-bottom:1px solid var(--line)}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .row{display:flex;gap:8px}
  .row>*{flex:1;min-width:0}
  input{
    width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--text);border-radius:5px;padding:8px 9px;font-size:13px;font-family:inherit;
  }
  input.mono{font-family:var(--mono)}
  input:focus{outline:2px solid var(--glow);outline-offset:1px;border-color:transparent}
  .f{margin-bottom:9px}

  button{font-family:inherit;cursor:pointer}
  .btn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);
       border-radius:5px;padding:8px 10px;font-size:12.5px}
  .btn:hover{background:rgba(79,227,193,.14);border-color:rgba(79,227,193,.4)}
  .btn:focus-visible{outline:2px solid var(--glow);outline-offset:1px}
  .btn-main{width:100%;background:rgba(79,227,193,.16);border-color:rgba(79,227,193,.5);
            color:var(--glow);font-weight:600}
  .btn-main:hover{background:rgba(79,227,193,.26)}
  .btns{display:flex;gap:7px}
  .btns .btn{flex:1}
  .hint{margin:8px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
  .hint.err{color:#ff8f8f}

  .toggles{display:flex;gap:16px;font-size:12px;color:var(--muted)}
  .toggles label{display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;font-size:12px}
  input[type=checkbox]{width:auto;accent-color:var(--glow)}

  .listwrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .lh{display:flex;justify-content:space-between;align-items:baseline;padding:15px 20px 8px}
  .lh h2{margin:0;font-size:12px;color:var(--muted);font-weight:600}
  .lh em{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--glow)}
  ul{list-style:none;margin:0;padding:0 12px 16px;overflow-y:auto;flex:1}
  li{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:6px;cursor:pointer;
     border:1px solid transparent}
  li:hover{background:rgba(255,255,255,.05)}
  li.on{background:rgba(79,227,193,.1);border-color:rgba(79,227,193,.35)}
  li:focus-visible{outline:2px solid var(--glow);outline-offset:-1px}
  .bead{width:7px;height:7px;border-radius:50%;background:var(--glow);
        box-shadow:0 0 7px var(--glow);flex:none;margin-top:5px}
  .nm{flex:1;min-width:0}
  .nm b{display:block;font-weight:400;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .x{border:none;background:none;color:var(--muted);font-size:15px;padding:2px 5px;border-radius:4px;flex:none}
  .x:hover{color:#ff8f8f;background:rgba(255,143,143,.12)}
  .none{padding:20px;color:var(--muted);font-size:12.5px;line-height:1.6}

  #toggle{
    position:fixed;top:14px;left:334px;z-index:11;transition:left .3s;
    background:var(--panel);backdrop-filter:blur(14px);
  }
  #panel.hidden ~ #toggle{left:14px}

  #loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;
           background:var(--void);font-size:13px;color:var(--muted);letter-spacing:2px}

  dialog{border:1px solid var(--line);background:#08111c;color:var(--text);border-radius:10px;
         padding:18px;width:min(540px,92vw)}
  dialog::backdrop{background:rgba(2,6,12,.7)}
  dialog h3{margin:0 0 10px;font-size:14px}
  dialog textarea{width:100%;min-height:200px;background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--text);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12px;resize:vertical}
  .da{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

  @media (max-width:800px){
    #panel{width:270px}
    #toggle{left:284px}
    .tag b{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){.tag{transition:none}}
</style>
</head>
<body>

<div id="stage"></div>
<div id="labels"></div>

<aside id="panel">
  <div class="head">
    <h1>全球点位地球</h1>
    <p>输入经纬度，对应位置会在球面上亮起。拖动旋转，滚轮缩放。</p>
  </div>

  <div class="sec">
    <div class="row">
      <div class="f"><label for="lat">纬度 lat</label><input id="lat" class="mono" inputmode="decimal" placeholder="31.2304"></div>
      <div class="f"><label for="lng">经度 lng</label><input id="lng" class="mono" inputmode="decimal" placeholder="121.4737"></div>
    </div>
    <div class="f"><label for="nm">名称</label><input id="nm" placeholder="例如：上海节点"></div>
    <button class="btn btn-main" id="add">点亮该坐标</button>
    <p class="hint" id="hint">纬度 -90 ~ 90，经度 -180 ~ 180。</p>
  </div>

  <div class="sec">
    <div class="toggles">
      <label><input type="checkbox" id="spin" checked> 自动旋转</label>
      <label><input type="checkbox" id="arcs" checked> 显示连线</label>
    </div>
  </div>

  <div class="listwrap">
    <div class="lh"><h2>已点亮</h2><em id="cnt">0</em></div>
    <ul id="list"></ul>
  </div>

  <div class="sec" style="border-bottom:none;border-top:1px solid var(--line)">
    <div class="btns">
      <button class="btn" id="imp">导入 JSON</button>
      <button class="btn" id="exp">导出</button>
      <button class="btn" id="clr">清空</button>
    </div>
  </div>
</aside>

<button class="btn" id="toggle" aria-label="收起面板">‹</button>

<div id="loading">正在生成地球…</div>

<dialog id="dlg">
  <h3 id="dt">导入 JSON</h3>
  <textarea id="dx" spellcheck="false"></textarea>
  <p class="hint" id="dh"></p>
  <div class="da">
    <button class="btn" id="dc">关闭</button>
    <button class="btn btn-main" id="dk" style="width:auto">确定</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";

/* ============================================================
   1) 你的点位数据 —— 直接改这里，或用侧栏 / 导入 JSON
   接后端： fetch('/api/nodes').then(r=>r.json()).then(l=>l.forEach(p=>light(p)))
   字段兼容 lat/latitude、lng/lon/longitude、name/title
============================================================ */
var SEED = [
  { lat: 39.9042,  lng: 116.4074, name: "北京" },
  { lat: 31.2304,  lng: 121.4737, name: "上海" },
  { lat: 22.3193,  lng: 114.1694, name: "香港" },
  { lat: 1.3521,   lng: 103.8198, name: "新加坡" },
  { lat: 35.6762,  lng: 139.6503, name: "东京" },
  { lat: 51.5074,  lng: -0.1278,  name: "伦敦" },
  { lat: 50.1109,  lng: 8.6821,   name: "法兰克福" },
  { lat: 37.7749,  lng: -122.4194,name: "旧金山" },
  { lat: 40.7128,  lng: -74.0060, name: "纽约" },
  { lat: -23.5505, lng: -46.6333, name: "圣保罗" },
  { lat: -33.8688, lng: 151.2093, name: "悉尼" },
  { lat: 25.2048,  lng: 55.2708,  name: "迪拜" }
];

/* ============================================================
   2) 简化陆地轮廓（用于生成点阵地球，非精确国界）
============================================================ */
var LAND = [
  /* 北美 */[[-168,65],[-165,60],[-158,57],[-152,58],[-146,60],[-138,59],[-131,53],[-125,49],[-124,42],[-120,34],[-117,32],[-110,24],[-105,20],[-97,16],[-92,15],[-88,16],[-87,21],[-91,21],[-95,19],[-97,23],[-97,26],[-94,29],[-89,29],[-84,30],[-81,25],[-80,32],[-76,35],[-70,42],[-67,45],[-60,47],[-56,51],[-56,54],[-64,60],[-78,62],[-78,55],[-82,55],[-86,66],[-95,68],[-105,68],[-115,70],[-125,70],[-135,69],[-145,70],[-156,71],[-166,68]],
  /* 格陵兰 */[[-45,60],[-52,64],[-53,68],[-62,70],[-68,76],[-62,82],[-40,83],[-24,80],[-20,73],[-30,68],[-42,61]],
  /* 南美 */[[-81,-4],[-79,0],[-77,8],[-72,12],[-62,10],[-60,8],[-52,5],[-50,0],[-44,-2],[-38,-5],[-35,-8],[-39,-13],[-39,-18],[-48,-25],[-53,-34],[-58,-38],[-62,-40],[-65,-45],[-68,-50],[-70,-54],[-75,-52],[-74,-45],[-73,-37],[-71,-30],[-70,-20],[-75,-15],[-81,-6]],
  /* 非洲 */[[-17,15],[-16,20],[-12,28],[-10,32],[-5,36],[10,37],[20,32],[28,31],[33,28],[35,23],[38,18],[43,12],[51,12],[51,5],[42,-1],[40,-10],[35,-20],[32,-26],[27,-34],[20,-35],[18,-30],[13,-20],[9,-1],[3,6],[-8,4],[-13,9]],
  /* 欧亚 */[[-10,36],[-9,43],[-2,48],[3,51],[6,53],[9,54],[11,58],[16,60],[22,60],[30,60],[28,66],[21,70],[32,71],[46,68],[62,70],[76,73],[92,75],[106,77],[116,74],[132,72],[146,70],[160,70],[170,66],[179,65],[172,60],[162,58],[155,52],[142,48],[135,43],[130,35],[122,32],[120,25],[110,20],[105,10],[100,6],[97,16],[90,22],[82,17],[77,8],[72,20],[66,25],[57,25],[50,30],[45,37],[36,36],[30,41],[26,38],[22,40],[16,38],[13,45],[8,44],[3,42],[-2,37]],
  /* 印尼 */[[95,5],[105,-6],[115,-9],[125,-9],[135,-5],[141,-3],[141,-9],[131,-8],[120,-10],[110,-8],[100,0],[95,5]],
  /* 澳洲 */[[113,-22],[114,-35],[118,-35],[129,-32],[137,-35],[141,-38],[147,-39],[151,-37],[153,-28],[145,-15],[142,-11],[136,-12],[130,-11],[125,-14],[118,-20]],
  /* 新西兰 */[[172,-41],[174,-37],[178,-38],[176,-41],[174,-46],[168,-46],[167,-44]],
  /* 日本 */[[130,31],[134,34],[139,35],[141,39],[145,44],[142,42],[137,37],[132,34],[130,31]],
  /* 英国 */[[-5,50],[-6,55],[-3,58],[-1,56],[1,53],[1,51],[-4,50]],
  /* 马达加斯加 */[[43,-12],[50,-15],[50,-25],[45,-25],[43,-17]],
  /* 冰岛 */[[-24,65],[-22,66],[-14,66],[-14,64],[-22,63]],
  /* 菲律宾 */[[120,18],[124,18],[126,10],[122,6],[119,11]],
  /* 古巴 */[[-85,22],[-77,23],[-74,20],[-80,21]]
];

function inPoly(lng, lat, poly) {
  var hit = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
}
function isLand(lng, lat) {
  if (lat < -62) return true;                 // 南极
  for (var i = 0; i < LAND.length; i++) if (inPoly(lng, lat, LAND[i])) return true;
  return false;
}

/* ============================================================
   3) 场景
============================================================ */
var R = 100;
var stage = document.getElementById("stage");
var W = window.innerWidth, H = window.innerHeight;

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(38, W / H, 1, 2000);
camera.position.set(0, 0, 330);

var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
stage.appendChild(renderer.domElement);

var globe = new THREE.Group();
scene.add(globe);

/* 实心内核：遮挡背面的点，并给地球体积感 */
var core = new THREE.Mesh(
  new THREE.SphereGeometry(R * 0.985, 64, 48),
  new THREE.MeshBasicMaterial({ color: 0x061420 })
);
globe.add(core);

/* 经纬网格 */
var grid = new THREE.LineSegments(
  new THREE.WireframeGeometry(new THREE.SphereGeometry(R * 0.99, 24, 16)),
  new THREE.LineBasicMaterial({ color: 0x0f3247, transparent: true, opacity: 0.35 })
);
globe.add(grid);

/* 大气辉光 */
var halo = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.18, 48, 32),
  new THREE.ShaderMaterial({
    vertexShader: "varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "varying vec3 vN; void main(){ float i = pow(0.62 - dot(vN, vec3(0.0,0.0,1.0)), 3.0); gl_FragColor = vec4(0.20,0.72,0.86,1.0) * i; }",
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
  })
);
scene.add(halo);

/* 陆地点阵：斐波那契球均匀采样后筛出陆地 */
function llFromVec(x, y, z) {
  var lat = Math.asin(y) * 180 / Math.PI;
  var d = Math.atan2(z, -x) * 180 / Math.PI;
  var lng = ((d - 180) % 360 + 540) % 360 - 180;
  return [lng, lat];
}
function vecFromLL(lat, lng, r) {
  var phi = (90 - lat) * Math.PI / 180, th = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
}

(function buildDots() {
  var N = 42000, gr = Math.PI * (3 - Math.sqrt(5)), pos = [];
  for (var i = 0; i < N; i++) {
    var y = 1 - (i / (N - 1)) * 2, rad = Math.sqrt(Math.max(0, 1 - y * y)), th = gr * i;
    var x = Math.cos(th) * rad, z = Math.sin(th) * rad;
    var ll = llFromVec(x, y, z);
    if (!isLand(ll[0], ll[1])) continue;
    pos.push(x * R, y * R, z * R);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  globe.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0x2f7f9c, size: 1.25, sizeAttenuation: true, transparent: true, opacity: 0.9
  })));
})();

/* ============================================================
   4) 点亮标记
============================================================ */
var GLOW = 0x4fe3c1;
var nodes = [];          // {id,lat,lng,name,group,ring,beam,phase,el}
var arcGroup = new THREE.Group(); globe.add(arcGroup);
var seq = 0, activeId = null;
var $ = function (i) { return document.getElementById(i); };

var beadGeo = new THREE.SphereGeometry(1.6, 12, 12);
var ringGeo = new THREE.RingGeometry(2.4, 3.1, 32);
var beamGeo = new THREE.CylinderGeometry(0.28, 0.28, 1, 6);

function light(raw, silent) {
  var lat = Number(raw.lat != null ? raw.lat : raw.latitude);
  var lng = Number(raw.lng != null ? raw.lng : (raw.lon != null ? raw.lon : raw.longitude));
  if (!isFinite(lat) || !isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;

  var n = {
    id: ++seq, lat: lat, lng: lng,
    name: String(raw.name || raw.title || ("点位 " + (nodes.length + 1))).slice(0, 40),
    phase: Math.random() * Math.PI * 2
  };

  var p = vecFromLL(lat, lng, R);
  var g = new THREE.Group();
  g.position.copy(p);
  g.lookAt(0, 0, 0);              // 让 +z 指向球心，环贴合地表

  var bead = new THREE.Mesh(beadGeo, new THREE.MeshBasicMaterial({ color: GLOW }));
  g.add(bead);

  var ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    color: GLOW, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false
  }));
  g.add(ring);

  var beam = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({
    color: GLOW, transparent: true, opacity: 0.32, depthWrite: false
  }));
  beam.scale.y = 14;
  beam.rotation.x = Math.PI / 2;   // 沿法线向外
  beam.position.z = -7;
  g.add(beam);

  globe.add(g);
  n.group = g; n.ring = ring; n.bead = bead;

  var el = document.createElement("div");
  el.className = "tag";
  el.innerHTML = "<b></b><span></span>";
  el.querySelector("b").textContent = n.name;
  el.querySelector("span").textContent = lat.toFixed(4) + ", " + lng.toFixed(4);
  document.getElementById("labels").appendChild(el);
  n.el = el;

  nodes.push(n);
  if (!silent) { renderList(); rebuildArcs(); }
  return n;
}

function douse(id) {
  var i = nodes.findIndex(function (n) { return n.id === id; });
  if (i < 0) return;
  var n = nodes[i];
  globe.remove(n.group);
  n.el.remove();
  nodes.splice(i, 1);
  if (activeId === id) activeId = null;
  renderList(); rebuildArcs();
}

/* 相邻点位之间的大圆弧 */
function rebuildArcs() {
  while (arcGroup.children.length) arcGroup.remove(arcGroup.children[0]);
  if (!$("arcs").checked || nodes.length < 2) return;

  for (var i = 0; i < nodes.length - 1; i++) {
    var a = vecFromLL(nodes[i].lat, nodes[i].lng, R).normalize();
    var b = vecFromLL(nodes[i + 1].lat, nodes[i + 1].lng, R).normalize();
    var ang = Math.acos(Math.min(1, Math.max(-1, a.dot(b))));
    if (ang < 1e-4) continue;

    var pts = [], STEP = 48;
    for (var t = 0; t <= STEP; t++) {
      var f = t / STEP;
      var s0 = Math.sin((1 - f) * ang) / Math.sin(ang), s1 = Math.sin(f * ang) / Math.sin(ang);
      var v = new THREE.Vector3(a.x * s0 + b.x * s1, a.y * s0 + b.y * s1, a.z * s0 + b.z * s1).normalize();
      pts.push(v.multiplyScalar(R * (1 + 0.22 * (ang / Math.PI) * Math.sin(Math.PI * f))));
    }
    var geo = new THREE.BufferGeometry().setFromPoints(pts);
    arcGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: GLOW, transparent: true, opacity: 0.28
    })));
  }
}

/* ============================================================
   5) 交互：拖拽 / 缩放 / 自动旋转 / 飞到点位
============================================================ */
var rot = { x: 0.35, y: 0 }, target = null, drag = false, last = { x: 0, y: 0 }, dist = 330;
var cv = renderer.domElement;

cv.addEventListener("pointerdown", function (e) {
  drag = true; target = null; last.x = e.clientX; last.y = e.clientY;
  cv.classList.add("dragging"); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", function (e) {
  if (!drag) return;
  rot.y += (e.clientX - last.x) * 0.005;
  rot.x += (e.clientY - last.y) * 0.005;
  rot.x = Math.max(-1.2, Math.min(1.2, rot.x));
  last.x = e.clientX; last.y = e.clientY;
});
["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
  cv.addEventListener(ev, function () { drag = false; cv.classList.remove("dragging"); });
});
cv.addEventListener("wheel", function (e) {
  e.preventDefault();
  dist = Math.max(160, Math.min(620, dist + e.deltaY * 0.4));
}, { passive: false });

/* 让某个点转到正对相机 */
function flyTo(n) {
  var p = vecFromLL(n.lat, n.lng, 1);
  var ry = Math.atan2(-p.x, p.z);
  var r = Math.sqrt(p.x * p.x + p.z * p.z);
  var rx = Math.atan2(p.y, r);
  var cur = rot.y, k = Math.round((cur - ry) / (Math.PI * 2));
  target = { x: rx, y: ry + k * Math.PI * 2 };
}

/* ============================================================
   6) 渲染循环
============================================================ */
var v3 = new THREE.Vector3(), clock = 0;

function frame() {
  requestAnimationFrame(frame);
  clock += 0.016;

  if (target) {
    rot.x += (target.x - rot.x) * 0.08;
    rot.y += (target.y - rot.y) * 0.08;
    if (Math.abs(target.y - rot.y) < 0.002 && Math.abs(target.x - rot.x) < 0.002) target = null;
  } else if ($("spin").checked && !drag) {
    rot.y += 0.0016;
  }

  globe.rotation.x = rot.x;
  globe.rotation.y = rot.y;
  camera.position.z += (dist - camera.position.z) * 0.1;

  /* 标记脉冲 + 标签跟随 */
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var t = (clock * 0.9 + n.phase) % 2;
    var on = n.id === activeId;
    var s = 1 + t * (on ? 2.6 : 1.7);
    n.ring.scale.set(s, s, s);
    n.ring.material.opacity = Math.max(0, (on ? 0.95 : 0.7) * (1 - t / 2));
    n.bead.scale.setScalar(on ? 1.5 : 1);

    n.group.getWorldPosition(v3);
    var front = v3.z > 0;
    v3.project(camera);
    n.el.style.opacity = front ? 1 : 0;
    if (front) {
      n.el.style.left = ((v3.x * 0.5 + 0.5) * W) + "px";
      n.el.style.top = ((-v3.y * 0.5 + 0.5) * H) + "px";
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", function () {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

/* ============================================================
   7) 侧栏
============================================================ */
function say(m, bad) { var h = $("hint"); h.textContent = m; h.className = "hint" + (bad ? " err" : ""); }

function renderList() {
  var ul = $("list"); $("cnt").textContent = nodes.length; ul.innerHTML = "";
  if (!nodes.length) {
    var li = document.createElement("li");
    li.className = "none"; li.textContent = "还没有点亮任何坐标。";
    ul.appendChild(li); return;
  }
  nodes.forEach(function (n) {
    var li = document.createElement("li");
    li.tabIndex = 0;
    li.className = n.id === activeId ? "on" : "";
    li.innerHTML = '<span class="bead"></span><span class="nm"><b></b><span></span></span><button class="x" aria-label="移除">&times;</button>';
    li.querySelector("b").textContent = n.name;
    li.querySelector(".nm span").textContent = n.lat.toFixed(4) + ", " + n.lng.toFixed(4);
    li.addEventListener("click", function (e) {
      if (e.target.classList.contains("x")) { douse(n.id); return; }
      activeId = n.id; flyTo(n); renderList();
    });
    li.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activeId = n.id; flyTo(n); renderList(); }
      if (e.key === "Delete") { e.preventDefault(); douse(n.id); }
    });
    ul.appendChild(li);
  });
}

$("add").addEventListener("click", function () {
  var lat = parseFloat($("lat").value), lng = parseFloat($("lng").value);
  if (!isFinite(lat) || !isFinite(lng)) return say("请填写有效的经纬度数字。", true);
  if (lat < -90 || lat > 90) return say("纬度必须在 -90 ~ 90 之间。", true);
  if (lng < -180 || lng > 180) return say("经度必须在 -180 ~ 180 之间。", true);
  var n = light({ lat: lat, lng: lng, name: $("nm").value.trim() });
  $("nm").value = "";
  activeId = n.id; flyTo(n); renderList();
  say("已点亮 " + n.name + "。");
});
["lat", "lng", "nm"].forEach(function (id) {
  $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") $("add").click(); });
});

$("arcs").addEventListener("change", rebuildArcs);

$("clr").addEventListener("click", function () {
  nodes.slice().forEach(function (n) { globe.remove(n.group); n.el.remove(); });
  nodes = []; activeId = null; renderList(); rebuildArcs(); say("已清空。");
});

$("toggle").addEventListener("click", function () {
  var p = $("panel"); p.classList.toggle("hidden");
  this.textContent = p.classList.contains("hidden") ? "›" : "‹";
});

var dlg = $("dlg"), mode = "imp";
$("imp").addEventListener("click", function () {
  mode = "imp"; $("dt").textContent = "导入 JSON"; $("dk").textContent = "确定导入";
  $("dx").value = '[\n  { "lat": 48.8566, "lng": 2.3522, "name": "巴黎" }\n]';
  $("dh").textContent = "数组格式，支持 lat/latitude、lng/lon/longitude、name/title。导入为追加。";
  dlg.showModal();
});
$("exp").addEventListener("click", function () {
  mode = "exp"; $("dt").textContent = "导出 JSON"; $("dk").textContent = "下载文件";
  $("dx").value = JSON.stringify(nodes.map(function (n) {
    return { lat: n.lat, lng: n.lng, name: n.name };
  }), null, 2);
  $("dh").textContent = "复制走，或下载为 nodes.json。";
  dlg.showModal();
});
$("dk").addEventListener("click", function () {
  if (mode === "imp") {
    var data;
    try { data = JSON.parse($("dx").value); }
    catch (err) { $("dh").textContent = "JSON 解析失败：" + err.message; return; }
    if (!Array.isArray(data)) { $("dh").textContent = "顶层必须是数组。"; return; }
    var ok = 0;
    data.forEach(function (d) { if (light(d, true)) ok++; });
    renderList(); rebuildArcs(); dlg.close();
    say("导入 " + ok + " 条，跳过 " + (data.length - ok) + " 条。");
  } else {
    var blob = new Blob([$("dx").value], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "nodes.json"; a.click();
    URL.revokeObjectURL(a.href);
  }
});
$("dc").addEventListener("click", function () { dlg.close(); });

/* 启动 */
SEED.forEach(function (p) { light(p, true); });
renderList(); rebuildArcs();
$("loading").style.display = "none";
frame();
})();
</script>
</body>
</html>
