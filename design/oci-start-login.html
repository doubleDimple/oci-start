<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · OCI-START</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --r:8px;
  }
  html[data-theme="dark"]{
    --bg:#090d12; --surface:#0d131a; --raise:#111922;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
    --text:#e8eef4; --muted:#7d8f9d; --faint:#4e5f6c;
    --brand:#15a077; --brand-hi:#1cc194; --brand-soft:rgba(28,193,148,.13);
    --land:#1e3140; --node:#2fe0a6;
    --danger:#ff7a7a;
  }
  html[data-theme="light"]{
    --bg:#f6f8f9; --surface:#ffffff; --raise:#ffffff;
    --line:rgba(10,30,45,.11); --line-2:rgba(10,30,45,.22);
    --text:#132029; --muted:#5f7280; --faint:#8ba0ad;
    --brand:#0f8b64; --brand-hi:#0b7454; --brand-soft:rgba(15,139,100,.09);
    --land:#c4d3dc; --node:#0f8b64;
    --danger:#c94a4a;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;
  }
  a{color:inherit}

  /* ---------------- 左：区域分布 ---------------- */
  .stage{
    flex:1 1 60%;min-width:0;position:relative;
    display:flex;flex-direction:column;padding:34px 46px 30px;
    border-right:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{width:22px;height:22px;display:block}
  .brand .nm{font-size:15px;font-weight:650;letter-spacing:.4px}
  .brand .nm em{font-style:normal;color:var(--muted);font-weight:400}

  .pitch{margin:auto 0 0;padding-bottom:26px;max-width:30ch}
  .pitch h2{
    margin:0;font-size:30px;line-height:1.32;font-weight:650;letter-spacing:-.2px;
  }
  .pitch p{margin:12px 0 0;font-size:14px;line-height:1.75;color:var(--muted)}

  .mapbox{position:relative;margin:0 -12px}
  .mapbox canvas{display:block;width:100%}
  #tip{
    position:absolute;pointer-events:none;opacity:0;transition:opacity .14s;
    background:var(--raise);border:1px solid var(--line-2);border-radius:6px;
    padding:6px 9px;font-size:11.5px;line-height:1.5;white-space:nowrap;
    transform:translate(-50%,-135%);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:3;
  }
  #tip b{display:block;font-weight:550;font-size:12px}
  #tip span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

  .stats{
    display:flex;gap:34px;margin-top:22px;padding-top:20px;
    border-top:1px solid var(--line);
  }
  .stat b{display:block;font-size:19px;font-weight:600;font-family:var(--mono);letter-spacing:-.5px}
  .stat span{font-size:11.5px;color:var(--muted)}
  .stat .live{color:var(--node)}
  .foot{margin-top:auto;padding-top:26px;font-size:11.5px;color:var(--faint)}
  .foot a{text-decoration:none;color:var(--muted)}
  .foot a:hover{color:var(--text)}

  /* ---------------- 右：登录 ---------------- */
  .auth{
    flex:0 0 max(420px,38%);display:flex;flex-direction:column;
    padding:26px 0 30px;background:var(--surface);
  }
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding:0 46px}
  .lang{display:flex;align-items:center;font-size:12.5px;color:var(--muted)}
  .lang button{
    background:none;border:none;font:inherit;color:var(--muted);cursor:pointer;
    padding:5px 7px;border-radius:5px;
  }
  .lang button[aria-current="true"]{color:var(--text);font-weight:550}
  .lang i{font-style:normal;color:var(--faint)}
  .icon-btn{
    background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;
    width:30px;height:30px;border-radius:6px;display:grid;place-items:center;margin-left:6px;
  }
  .icon-btn:hover{background:var(--brand-soft);color:var(--text)}
  .icon-btn svg{width:15px;height:15px}
  button:focus-visible,input:focus-visible,a:focus-visible{
    outline:2px solid var(--brand-hi);outline-offset:2px
  }

  form{margin:auto 0;padding:0 46px;width:100%;max-width:400px;align-self:center}
  h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.3px}
  .lede{margin:9px 0 30px;font-size:13.5px;color:var(--muted)}

  .field{margin-bottom:17px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px}
  .ctrl{position:relative;display:flex;align-items:center}
  input[type=text],input[type=password]{
    width:100%;font:inherit;font-size:14px;color:var(--text);
    background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 13px;transition:border-color .15s,box-shadow .15s;
  }
  html[data-theme="light"] input[type=text],
  html[data-theme="light"] input[type=password]{background:#fbfcfd}
  input::placeholder{color:var(--faint)}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  input.bad{border-color:var(--danger)}
  .peek{
    position:absolute;right:6px;background:none;border:none;cursor:pointer;
    color:var(--faint);padding:6px;border-radius:5px;display:grid;place-items:center;
  }
  .peek:hover{color:var(--text)}
  .peek svg{width:16px;height:16px}
  .err{display:none;margin:6px 0 0;font-size:11.5px;color:var(--danger)}
  .err.show{display:block}

  .aux{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .check input{accent-color:var(--brand);width:14px;height:14px;cursor:pointer}
  .link{font-size:12.5px;color:var(--muted);text-decoration:none}
  .link:hover{color:var(--brand-hi)}

  .submit{
    width:100%;font:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;
    background:var(--brand);border:1px solid var(--brand);border-radius:var(--r);
    padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s;
  }
  .submit:hover:not(:disabled){background:var(--brand-hi);border-color:var(--brand-hi)}
  .submit:disabled{opacity:.7;cursor:default}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
        border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:none}
  .submit.busy .spin{display:block}
  .submit.busy .txt{opacity:.85}
  @keyframes sp{to{transform:rotate(360deg)}}

  .msg{margin:14px 0 0;font-size:12px;color:var(--muted);text-align:center;min-height:16px}

  .authfoot{padding:0 46px;font-size:11.5px;color:var(--faint);text-align:center}

  /* ---------------- 响应式 ---------------- */
  @media (max-width:980px){
    body{flex-direction:column;overflow-y:auto;height:auto;min-height:100%}
    .stage{flex:none;padding:24px 26px 26px;border-right:none;border-bottom:1px solid var(--line)}
    .pitch{margin-top:26px;padding-bottom:20px;max-width:none}
    .pitch h2{font-size:23px}
    .auth{flex:none;padding:22px 0 34px}
    .topbar,form,.authfoot{padding-left:26px;padding-right:26px}
    form{margin:20px auto 0}
    .stats{gap:24px}
  }
  @media (max-width:520px){
    .stage .mapbox,.stage .stats{display:none}
    .pitch{margin:18px 0 0}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ 左：区域分布 ============ -->
<section class="stage">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2.5c0 0 6.8 7.4 6.8 12.1A6.8 6.8 0 0 1 12 21.4a6.8 6.8 0 0 1-6.8-6.8C5.2 9.9 12 2.5 12 2.5z"
            stroke="var(--brand-hi)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M12 17.6a3 3 0 0 1-3-3c0-1.6 3-5 3-5s3 3.4 3 5a3 3 0 0 1-3 3z" fill="var(--brand-hi)"/>
    </svg>
    <span class="nm">OCI-START <em>/ 多云工作台</em></span>
  </div>

  <div class="pitch">
    <h2>所有云端，一处掌控。</h2>
    <p>把分散在各个租户里的实例、网络与自动化任务，收进同一个控制台。</p>
  </div>

  <div class="mapbox">
    <canvas id="map"></canvas>
    <div id="tip"></div>
  </div>

  <div class="stats">
    <div class="stat"><b id="nRegion">0</b><span>覆盖区域</span></div>
    <div class="stat"><b>OCI · GCP</b><span>已接入云厂商</span></div>
    <div class="stat"><b class="live">30s</b><span>状态轮询间隔</span></div>
  </div>

  <div class="foot">© 2026 doubleDimple · <a href="#">GitHub</a> · <a href="#">文档</a></div>
</section>

<!-- ============ 右：登录 ============ -->
<section class="auth">
  <div class="topbar">
    <div class="lang">
      <button aria-current="true" data-lang="zh">中文</button><i>/</i><button data-lang="en">EN</button>
    </div>
    <button class="icon-btn" id="theme" aria-label="切换深浅色">
      <svg id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </div>

  <form id="form" novalidate>
    <h1>欢迎回来</h1>
    <p class="lede">登录后继续管理你的云端资源。</p>

    <div class="field">
      <label for="u">用户名</label>
      <div class="ctrl"><input id="u" type="text" autocomplete="username" placeholder="用户名或邮箱"></div>
      <p class="err" id="eu">请输入用户名</p>
    </div>

    <div class="field">
      <label for="p">密码</label>
      <div class="ctrl">
        <input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="peek" id="peek" aria-label="显示密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
          </svg>
        </button>
      </div>
      <p class="err" id="ep">请输入密码</p>
    </div>

    <div class="aux">
      <label class="check"><input type="checkbox" id="rm"> 记住我</label>
      <a class="link" href="#">忘记密码？</a>
    </div>

    <button class="submit" id="go" type="submit">
      <span class="spin"></span><span class="txt">登录</span>
    </button>
    <p class="msg" id="msg"></p>
  </form>

  <div class="authfoot">还没有账号？请联系管理员开通</div>
</section>

<script>
/* =========================================================
   区域分布图：Canvas 点阵，等距柱状投影
========================================================= */
(function () {
"use strict";

var LAND = [
  [[-168,65],[-165,60],[-158,57],[-152,58],[-146,60],[-138,59],[-131,53],[-125,49],[-124,42],[-120,34],[-117,32],[-110,24],[-105,20],[-97,16],[-92,15],[-88,16],[-87,21],[-91,21],[-95,19],[-97,23],[-97,26],[-94,29],[-89,29],[-84,30],[-81,25],[-80,32],[-76,35],[-70,42],[-67,45],[-60,47],[-56,51],[-56,54],[-64,60],[-78,62],[-78,55],[-82,55],[-86,66],[-95,68],[-105,68],[-115,70],[-125,70],[-135,69],[-145,70],[-156,71],[-166,68]],
  [[-45,60],[-52,64],[-53,68],[-62,70],[-68,76],[-62,82],[-40,83],[-24,80],[-20,73],[-30,68],[-42,61]],
  [[-81,-4],[-79,0],[-77,8],[-72,12],[-62,10],[-60,8],[-52,5],[-50,0],[-44,-2],[-38,-5],[-35,-8],[-39,-13],[-39,-18],[-48,-25],[-53,-34],[-58,-38],[-62,-40],[-65,-45],[-68,-50],[-70,-54],[-75,-52],[-74,-45],[-73,-37],[-71,-30],[-70,-20],[-75,-15],[-81,-6]],
  [[-17,15],[-16,20],[-12,28],[-10,32],[-5,36],[10,37],[20,32],[28,31],[33,28],[35,23],[38,18],[43,12],[51,12],[51,5],[42,-1],[40,-10],[35,-20],[32,-26],[27,-34],[20,-35],[18,-30],[13,-20],[9,-1],[3,6],[-8,4],[-13,9]],
  [[-10,36],[-9,43],[-2,48],[3,51],[6,53],[9,54],[11,58],[16,60],[22,60],[30,60],[28,66],[21,70],[32,71],[46,68],[62,70],[76,73],[92,75],[106,77],[116,74],[132,72],[146,70],[160,70],[170,66],[179,65],[172,60],[162,58],[155,52],[142,48],[135,43],[130,35],[122,32],[120,25],[110,20],[105,10],[100,6],[97,16],[90,22],[82,17],[77,8],[72,20],[66,25],[57,25],[50,30],[45,37],[36,36],[30,41],[26,38],[22,40],[16,38],[13,45],[8,44],[3,42],[-2,37]],
  [[95,5],[105,-6],[115,-9],[125,-9],[135,-5],[141,-3],[141,-9],[131,-8],[120,-10],[110,-8],[100,0]],
  [[113,-22],[114,-35],[118,-35],[129,-32],[137,-35],[141,-38],[147,-39],[151,-37],[153,-28],[145,-15],[142,-11],[136,-12],[130,-11],[125,-14],[118,-20]],
  [[172,-41],[174,-37],[178,-38],[176,-41],[174,-46],[168,-46],[167,-44]],
  [[130,31],[134,34],[139,35],[141,39],[145,44],[142,42],[137,37],[132,34]],
  [[-5,50],[-6,55],[-3,58],[-1,56],[1,53],[1,51],[-4,50]],
  [[43,-12],[50,-15],[50,-25],[45,-25],[43,-17]],
  [[120,18],[124,18],[126,10],[122,6],[119,11]]
];

/* 真实 OCI 商业区域，按需增删 */
var REGIONS = [
  { code:"ap-tokyo-1",      name:"东京",       lat:35.68,  lng:139.69 },
  { code:"ap-osaka-1",      name:"大阪",       lat:34.69,  lng:135.50 },
  { code:"ap-seoul-1",      name:"首尔",       lat:37.57,  lng:126.98 },
  { code:"ap-singapore-1",  name:"新加坡",     lat:1.35,   lng:103.82 },
  { code:"ap-mumbai-1",     name:"孟买",       lat:19.08,  lng:72.88  },
  { code:"ap-sydney-1",     name:"悉尼",       lat:-33.87, lng:151.21 },
  { code:"eu-frankfurt-1",  name:"法兰克福",   lat:50.11,  lng:8.68   },
  { code:"eu-amsterdam-1",  name:"阿姆斯特丹", lat:52.37,  lng:4.90   },
  { code:"uk-london-1",     name:"伦敦",       lat:51.51,  lng:-0.13  },
  { code:"eu-zurich-1",     name:"苏黎世",     lat:47.38,  lng:8.54   },
  { code:"us-ashburn-1",    name:"阿什本",     lat:39.04,  lng:-77.49 },
  { code:"us-phoenix-1",    name:"凤凰城",     lat:33.45,  lng:-112.07},
  { code:"us-sanjose-1",    name:"圣何塞",     lat:37.34,  lng:-121.89},
  { code:"ca-toronto-1",    name:"多伦多",     lat:43.65,  lng:-79.38 },
  { code:"sa-saopaulo-1",   name:"圣保罗",     lat:-23.55, lng:-46.63 },
  { code:"me-jeddah-1",     name:"吉达",       lat:21.49,  lng:39.19  },
  { code:"af-johannesburg-1",name:"约翰内斯堡",lat:-26.20, lng:28.05  }
];

function inPoly(x, y, poly) {
  var hit = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
}
function isLand(lng, lat) {
  for (var i = 0; i < LAND.length; i++) if (inPoly(lng, lat, LAND[i])) return true;
  return false;
}

var TOP = 78, BOT = -52, SPAN = TOP - BOT;
var cv = document.getElementById("map"), ctx = cv.getContext("2d"), tip = document.getElementById("tip");
var W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
var base = document.createElement("canvas");
var hover = null, css = getComputedStyle(document.documentElement);
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function v(n) { return css.getPropertyValue(n).trim(); }

function buildBase() {
  base.width = W * dpr; base.height = H * dpr;
  var b = base.getContext("2d");
  b.setTransform(dpr, 0, 0, dpr, 0, 0);
  b.clearRect(0, 0, W, H);
  b.fillStyle = v("--land");
  var s = W > 620 ? 5 : 6, r = Math.max(.7, s * .21);
  for (var y = s / 2; y < H; y += s) {
    for (var x = s / 2; x < W; x += s) {
      var lng = x / W * 360 - 180, lat = TOP - y / H * SPAN;
      if (!isLand(lng, lat)) continue;
      b.beginPath(); b.arc(x, y, r, 0, 6.2832); b.fill();
    }
  }
}

function layout() {
  W = cv.parentNode.clientWidth || 600;
  H = Math.round(W * SPAN / 360);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  REGIONS.forEach(function (r) {
    r.px = (r.lng + 180) / 360 * W;
    r.py = (TOP - r.lat) / SPAN * H;
    if (r.phase === undefined) r.phase = Math.random() * 2400;
  });
  buildBase();
}

function draw(now) {
  requestAnimationFrame(draw);
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(base, 0, 0, W, H);

  var node = v("--node");
  for (var i = 0; i < REGIONS.length; i++) {
    var r = REGIONS[i], on = hover === r;

    if (!reduce) {
      var t = ((now + r.phase) % 2400) / 2400;
      ctx.strokeStyle = node;
      ctx.globalAlpha = (1 - t) * (on ? .7 : .32);
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(r.px, r.py, 2.5 + t * (on ? 15 : 10), 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    var g = ctx.createRadialGradient(r.px, r.py, 0, r.px, r.py, on ? 12 : 8);
    g.addColorStop(0, node); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = on ? .45 : .26;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(r.px, r.py, on ? 12 : 8, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = node;
    ctx.beginPath(); ctx.arc(r.px, r.py, on ? 3.2 : 2.3, 0, 6.2832); ctx.fill();
  }
}

cv.addEventListener("mousemove", function (e) {
  var b = cv.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top, best = null, bd = 196;
  REGIONS.forEach(function (r) {
    var d = (r.px - mx) * (r.px - mx) + (r.py - my) * (r.py - my);
    if (d < bd) { bd = d; best = r; }
  });
  hover = best;
  cv.style.cursor = best ? "pointer" : "default";
  if (best) {
    tip.style.left = best.px + "px";
    tip.style.top = best.py + "px";
    tip.innerHTML = "<b>" + best.name + "</b><span>" + best.code + "</span>";
    tip.style.opacity = 1;
  } else tip.style.opacity = 0;
});
cv.addEventListener("mouseleave", function () { hover = null; tip.style.opacity = 0; });

addEventListener("resize", layout);
document.getElementById("nRegion").textContent = REGIONS.length;
layout();
requestAnimationFrame(draw);

/* 主题切换后重画点阵颜色 */
window.__remap = function () { css = getComputedStyle(document.documentElement); buildBase(); };
})();

/* =========================================================
   表单与主题
========================================================= */
(function () {
"use strict";
var $ = function (i) { return document.getElementById(i); };

/* 主题 */
$("theme").addEventListener("click", function () {
  var root = document.documentElement;
  var next = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  this.setAttribute("aria-label", next === "dark" ? "切换到浅色" : "切换到深色");
  window.__remap();
});

/* 语言（示意，接你的 i18n） */
document.querySelectorAll(".lang button").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll(".lang button").forEach(function (x) { x.setAttribute("aria-current", "false"); });
    b.setAttribute("aria-current", "true");
  });
});

/* 密码可见 */
$("peek").addEventListener("click", function () {
  var p = $("p"), show = p.type === "password";
  p.type = show ? "text" : "password";
  this.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
  p.focus();
});

/* 校验 + 提交 */
function mark(input, errEl, bad) {
  input.classList.toggle("bad", bad);
  errEl.classList.toggle("show", bad);
}
["u", "p"].forEach(function (id) {
  $(id).addEventListener("input", function () { mark($(id), $("e" + id), false); $("msg").textContent = ""; });
});

$("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var u = $("u").value.trim(), p = $("p").value;
  mark($("u"), $("eu"), !u);
  mark($("p"), $("ep"), !p);
  if (!u || !p) { ($("u").value.trim() ? $("p") : $("u")).focus(); return; }

  var btn = $("go");
  btn.classList.add("busy"); btn.disabled = true;
  $("msg").textContent = "";

  /* 换成你的接口：
     fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
       body: JSON.stringify({ username:u, password:p, remember:$('rm').checked }) })
  */
  setTimeout(function () {
    btn.classList.remove("busy"); btn.disabled = false;
    $("msg").textContent = "这是静态演示，把 submit 里的 setTimeout 换成登录接口即可。";
  }, 1100);
});
})();
</script>
</body>
</html>
